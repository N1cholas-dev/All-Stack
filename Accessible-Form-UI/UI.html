<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Accessible Form UI — HTML & CSS</title>
    <style>
        :root {
            --bg: #f9fafb;
            --surface: #ffffff;
            --primary: #2563eb;
            --primary-hover: #1e40af;
            --border: #d1d5db;
            --text: #111827;
            --muted: #6b7280;
            --error: #dc2626;
            --radius: 8px;
            font-family: Inter, system-ui, sans-serif;
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;

            /* Background blur gradient */
            background: linear-gradient(135deg, rgba(99, 132, 255, 0.4), rgba(156, 236, 251, 0.4));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            /* Optional aesthetic */
            background-color: rgba(255, 255, 255, 0.2);
            font-family: "Segoe UI", sans-serif;
        }

        form {
            width: 100%;
            max-width: 420px;
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            padding: 24px;
        }

        h1 {
            font-size: 20px;
            margin: 0 0 20px 0;
            text-align: center;
        }

        .field {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            color: var(--text);
            margin-bottom: 4px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 14px;
            color: var(--text);
            background-color: #fff;
            transition: border-color .15s ease, box-shadow .15s ease;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }

        .helper-text {
            font-size: 12px;
            color: var(--muted);
            margin-top: 4px;
        }

        .error-text {
            font-size: 12px;
            color: var(--error);
            margin-top: 4px;
        }

        .checkbox-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }

        .checkbox-group input[type="checkbox"] {
            flex-shrink: 0;
            width: 18px;
            height: 18px;
            margin: 0;
        }

        .checkbox-group label {
            margin: 0;
            font-weight: 500;
            color: var(--text);
            font-size: 14px;
            line-height: 1.4;
        }

        button {
            width: 100%;
            background: var(--primary);
            color: #fff;
            font-weight: 600;
            padding: 10px 14px;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 15px;
            transition: background .15s ease;
        }

        button:hover {
            background: var(--primary-hover)
        }

        button:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.3);
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important
            }
        }
    </style>
</head>

<body>
    <form aria-labelledby="form-title" novalidate>
        <h1 id="form-title">Formulir Kontak</h1>

        <div class="field">
            <label for="name">Nama Lengkap</label>
            <input id="name" name="name" type="text" aria-required="true" placeholder="Masukkan nama anda" />
            <p class="helper-text">Contoh: Nicholas Ekada</p>
        </div>

        <div class="field">
            <label for="email">Alamat Email</label>
            <input id="email" name="email" type="email" aria-required="true" placeholder="nama@contoh.com" />
        </div>

        <div class="field">
            <label for="subject">Subjek</label>
            <select id="subject" name="subject">
                <option value="">Pilih subjek</option>
                <option value="dukungan">Dukungan Teknis</option>
                <option value="kerja-sama">Kerja Sama</option>
                <option value="lainnya">Lainnya</option>
            </select>
        </div>

        <div class="field">
            <label for="message">Pesan</label>
            <textarea id="message" name="message" rows="4" placeholder="Tulis pesan anda..."
                aria-describedby="message-help"></textarea>
            <p id="message-help" class="helper-text">Minimal 20 karakter.</p>
        </div>

        <div class="field checkbox-group">
            <input id="agree" type="checkbox" name="agree" aria-required="true" />
            <label for="agree">Saya setuju dengan kebijakan privasi</label>
        </div>

        <button type="submit">Kirim</button>
    </form>
</body>

</html>
