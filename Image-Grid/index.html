 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Image Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="grid-container">
        <div class="grid-item"><img src="images/undefined (8).jpg" alt="Image 1"></div>
        <div class="grid-item"><img src="images/undefined (9).jpg" alt="Image 2"></div>
        <div class="grid-item"><img src="images/undefined (10).jpg" alt="Image 3"></div>
        <div class="grid-item"><img src="images/undefined (11).jpg" alt="Image 4"></div>
        <div class="grid-item"><img src="images/undefined (12).jpg" alt="Image 5"></div>
        <div class="grid-item"><img src="images/A collection of some of my favorite night photos….jpg" alt="Image 6"></div>
    </div>
</body>
</html>
